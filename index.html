<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>くろの絵日記</title>

<style>
/* 絵日記帳: 上に絵の枠、下に罫線の文章。天気欄は「くろのきげん」。机の上にノートを広げたレイアウト */
:root {
  --desk: #e7ecf1;
  --paper: #ffffff;
  --ink: #272a31;
  --ink-soft: #5f6672;
  --rule: #d3deee;
  --frame: #2f3440;
  --crayon: #d9503d;
  --crayon-soft: #fbe3de;
  --leaf: #2f7d5c;
  --leaf-soft: #ddf0e6;
  --sun: #b77a0c;
  --sun-soft: #fbefd2;
  --sky: #2f63a8;
  --sky-soft: #dde8f7;
  --shadow: 0 1px 0 rgba(30, 40, 60, .06), 0 6px 18px -10px rgba(30, 40, 60, .35);
  --veil: rgba(236, 240, 245, .34);
  --glass: rgba(255, 255, 255, .84);
  --m-やる気: #d9503d; --m-いたずら: #7a4cc2; --m-甘え: #cc4f8c;
  --m-真剣: #2f63a8; --m-わからん: #2f7d5c; --m-ごきげん斜め: #6b6f78;
  --f-hand: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  --lh: 2rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #12151b; --paper: #1d2129; --ink: #ebe8e1; --ink-soft: #a3a9b4; --rule: #2e3747;
    --frame: #c9ccd3; --crayon: #ff7d6b; --crayon-soft: #3d2420; --leaf: #6cc79c; --leaf-soft: #1b3329;
    --sun: #f0b84e; --sun-soft: #3a2f17; --sky: #86b1ec; --sky-soft: #1c2a40;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .8);
    --veil: rgba(14, 17, 23, .56);
    --glass: rgba(29, 33, 41, .84);
    --m-やる気: #ff7d6b; --m-いたずら: #b592f0; --m-甘え: #f08cbd;
    --m-真剣: #86b1ec; --m-わからん: #6cc79c; --m-ごきげん斜め: #a3a9b4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #12151b; --paper: #1d2129; --ink: #ebe8e1; --ink-soft: #a3a9b4; --rule: #2e3747;
  --frame: #c9ccd3; --crayon: #ff7d6b; --crayon-soft: #3d2420; --leaf: #6cc79c; --leaf-soft: #1b3329;
  --sun: #f0b84e; --sun-soft: #3a2f17; --sky: #86b1ec; --sky-soft: #1c2a40;
  --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 8px 20px -12px rgba(0, 0, 0, .8);
  --veil: rgba(14, 17, 23, .56);
  --glass: rgba(29, 33, 41, .84);
  --m-やる気: #ff7d6b; --m-いたずら: #b592f0; --m-甘え: #f08cbd;
  --m-真剣: #86b1ec; --m-わからん: #6cc79c; --m-ごきげん斜め: #a3a9b4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* margin: 0 と上の余白は、くろアプリ版（ホーム画面のWebアプリ）で必要。ステータスバーの分だけ下げて、sticky のメニューとずれないようにする */
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); background: var(--desk); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
/* ふたりの部屋（背景）。iOS は background-attachment: fixed が効かないので固定の板を敷く */
.room-bg { position: fixed; inset: 0; z-index: 0; background: var(--desk) center 35% / cover no-repeat; }
.room-bg::after { content: ""; position: absolute; inset: 0; background: var(--veil); backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px); }
/* 背景の上にじかに乗る文字は、すりガラスのラベルに乗せる */
.lead, .room-note, .album-day h3, .glass { background: var(--glass); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); border-radius: 12px; box-shadow: var(--shadow); }
.lead { padding: 12px 16px; width: fit-content; max-width: 100%; }
.room-note { padding: 8px 14px; }
.album-day h3 { padding: 6px 8px 6px 14px; width: fit-content; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--crayon); outline-offset: 2px; }

/* ヘッダーとタブ */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top-inner { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-hand); font-weight: 600; font-size: 1.45rem; letter-spacing: .04em; }
.brand small { color: var(--ink-soft); font-size: .8rem; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 8px 12px 10px; cursor: pointer; color: var(--ink-soft); font-weight: 500; border-bottom: 3px solid transparent; }
.tab[aria-current="true"] { color: var(--ink); border-bottom-color: var(--crayon); }

main { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
.lead { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
.lead h2 { margin: 0; font-family: var(--f-hand); font-weight: 600; font-size: 1.5rem; text-wrap: balance; }
.lead p { margin: 0; color: var(--ink-soft); max-width: 62ch; }

/* 今日のくろ */
.today { display: flex; align-items: center; gap: 14px; background: var(--paper); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 22px; }
.today img { width: 64px; height: 64px; object-fit: contain; flex: none; }
.today b { font-family: var(--f-hand); font-size: 1.15rem; }
.today p { margin: 0; color: var(--ink-soft); font-size: .9rem; }

/* 日記カード */
.diary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.page { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; border: 0; width: 100%; min-width: 0; }
.page:hover { transform: translateY(-2px); }
@media (prefers-reduced-motion: no-preference) { .page { transition: transform .15s ease; } }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-hand); }
.page-date { font-size: 1.15rem; font-weight: 600; }
.picture { border: 2px solid var(--frame); border-radius: 2px; aspect-ratio: 4 / 3; overflow: hidden; background: var(--desk); display: grid; place-items: center; max-width: 100%; position: relative; }
.picture > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.picture:not(.empty) > img { position: absolute; inset: 0; }  /* iOS Safari が画像の差しかえ後に枠を計算し直さず、上がグレーになるのを防ぐ */
.picture .more { position: absolute; right: 6px; bottom: 6px; background: var(--paper); color: var(--ink); font-size: .75rem; padding: 1px 8px; border-radius: 99px; }
.picture.empty img { width: 46%; height: auto; object-fit: contain; opacity: .9; }
.ruled { font-family: var(--f-hand); line-height: var(--lh); background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px)); background-size: 100% var(--lh); margin: 0; padding: 0; list-style: none; }
.ruled li { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.page-foot { color: var(--ink-soft); font-size: .8rem; }

/* きげん欄 */
.mood { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-ui); font-size: .78rem; border: 1.5px solid var(--mc, var(--ink-soft)); color: var(--mc, var(--ink-soft)); border-radius: 99px; padding: 1px 10px 1px 3px; white-space: nowrap; }
.mood img { width: 22px; height: 22px; object-fit: contain; }

/* 日記の1日 */
.day { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin: 0 auto; }
.day-nav { display: flex; justify-content: space-between; gap: 8px; max-width: 760px; margin: 0 auto 12px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--rule); background: var(--paper); border-radius: 99px; padding: 4px 14px; cursor: pointer; font-size: .85rem; }
.btn:hover { border-color: var(--ink-soft); }
.btn[disabled] { opacity: .35; cursor: default; }
.day-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--f-hand); border-bottom: 2px solid var(--frame); padding-bottom: 8px; }
.day-head h2 { margin: 0; font-size: 1.6rem; font-weight: 600; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.strip button { flex: none; border: 2px solid transparent; padding: 0; background: none; cursor: pointer; border-radius: 4px; overflow: hidden; }
.strip button[aria-current="true"] { border-color: var(--crayon); }
.strip img { width: 64px; height: 64px; object-fit: cover; display: block; }

/* Markdown 本文 */
.md { font-family: var(--f-hand); font-size: 1.02rem; line-height: 1.95; min-width: 0; overflow-wrap: anywhere; }
.md h1 { display: none; }
.md h2 { font-size: 1.15rem; margin: 1.4em 0 .3em; padding-bottom: 2px; border-bottom: 1.5px dashed var(--rule); }
.md h3 { font-size: 1.02rem; margin: 1.2em 0 .2em; }
.md ul, .md ol { padding-left: 1.2em; margin: .3em 0; }
.md li { margin: .15em 0; }
.md li::marker { color: var(--crayon); }
.md p { margin: .4em 0; }
.md strong { background: linear-gradient(transparent 62%, var(--sun-soft) 62%); font-weight: 600; }
.md img.embed { display: block; max-height: 220px; width: auto; max-width: 100%; border-radius: 4px; margin: 6px 0; cursor: zoom-in; border: 1.5px solid var(--rule); }
.md table { border-collapse: collapse; font-size: .9rem; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--rule); padding: 4px 8px; }
.md code { font-size: .88em; background: var(--desk); padding: 1px 4px; border-radius: 3px; }
.md pre { overflow-x: auto; background: var(--desk); padding: 10px; border-radius: 6px; }
.md blockquote { margin: .5em 0; padding-left: 12px; border-left: 3px solid var(--rule); color: var(--ink-soft); }
.wl { color: var(--sky); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--sky) 40%, transparent); text-underline-offset: 3px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; }
.wl.missing { color: var(--ink-soft); text-decoration: underline dotted; cursor: default; }
.att { font-family: var(--f-ui); font-size: .8rem; color: var(--ink-soft); border: 1px dashed var(--rule); border-radius: 4px; padding: 0 6px; }

/* アルバム */
.album-day { margin-bottom: 26px; }
.album-day h3 { font-family: var(--f-hand); font-weight: 600; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(30%, 140px), 1fr)); gap: 6px; }
.album-grid button { border: 0; padding: 0; background: var(--paper); aspect-ratio: 1; overflow: hidden; cursor: zoom-in; border-radius: 3px; max-width: 100%; }
.album-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* チップ */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { border: 1.5px solid var(--rule); background: var(--paper); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pill { font-size: .75rem; padding: 1px 9px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
.pill.s-行った { background: var(--leaf-soft); color: var(--leaf); }
.pill.s-常連 { background: var(--crayon-soft); color: var(--crayon); }
.pill.s-行きたい { background: var(--sky-soft); color: var(--sky); }
.pill.s-予約済み { background: var(--sun-soft); color: var(--sun); }

/* お店 */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.shop { background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.shop-photo { aspect-ratio: 16 / 10; background: var(--desk); display: grid; place-items: center; color: var(--ink-soft); font-family: var(--f-hand); max-width: 100%; position: relative; overflow: hidden; }
.shop-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shop-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
.shop-title { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.shop-title b { font-family: var(--f-hand); font-size: 1.1rem; line-height: 1.4; }
.shop-meta { color: var(--ink-soft); font-size: .82rem; }
.shop-stats { display: flex; gap: 14px; font-size: .82rem; font-variant-numeric: tabular-nums; margin-top: 4px; }
.shop-stats span b { font-size: 1rem; }

/* とりせつ */
.manual { max-width: 820px; }
.manual-cover { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px; border-top: 6px solid var(--crayon); }
.manual-cover .label { font-size: .75rem; letter-spacing: .12em; color: var(--crayon); font-weight: 700; }
.manual-cover h2 { margin: 2px 0 6px; font-family: var(--f-hand); font-size: 1.7rem; font-weight: 600; }
.manual-cover p { margin: 0; color: var(--ink-soft); font-size: .9rem; }
.spec { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.spec article { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.spec .no { font-size: .72rem; color: var(--ink-soft); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.spec h3 { margin: 2px 0 4px; font-family: var(--f-hand); font-size: 1.15rem; font-weight: 600; }
.spec .md { font-size: .95rem; line-height: 1.85; }
.spec .wide { grid-column: 1 / -1; }

/* ノート・プロジェクトの一覧 */
.search { margin-bottom: 12px; max-width: 520px; }
.search label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.search input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 99px; padding: 8px 16px; box-shadow: var(--shadow); }
.search input:focus { outline: none; border-color: var(--crayon); }
.entries { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.entry { background: var(--paper); border: 0; border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.entry:hover { outline: 1.5px solid var(--rule); }
.entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.entry-head b { font-family: var(--f-hand); font-size: 1.05rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.entry-text { color: var(--ink-soft); font-size: .86rem; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.entry-meta .tag { color: var(--sky); }

/* くろのへや */
.room { max-width: 820px; display: flex; flex-direction: column; gap: 16px; }
.room-cover { display: flex; gap: 16px; align-items: center; background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; }
.room-cover img { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; flex: none; border: 3px solid var(--paper); box-shadow: 0 0 0 2px var(--ink); }
.room-cover h2 { margin: 0; font-family: var(--f-hand); font-size: 1.5rem; font-weight: 600; }
.room-cover p { margin: 2px 0 0; color: var(--ink-soft); font-size: .9rem; }
.room-note { font-size: .82rem; color: var(--ink-soft); margin: 0; }
.log { display: flex; flex-direction: column; gap: 14px; }
.log article { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
.log .when { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--f-hand); font-weight: 600; font-size: 1.1rem; border-bottom: 1.5px dashed var(--rule); padding-bottom: 4px; }
.log .when small { font-family: var(--f-ui); font-weight: 400; font-size: .78rem; color: var(--ink-soft); }
.log .md { font-size: .97rem; line-height: 1.9; }
.log .md > ul > li + li { margin-top: .6em; }
.others { display: flex; gap: 8px; flex-wrap: wrap; }

/* ふりかえり */
.weeks { display: flex; flex-direction: column; gap: 20px; max-width: 860px; }
.week { background: var(--paper); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 640px) { .week { grid-template-columns: minmax(0, 1fr); } }
.week-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
.week-head h3 { margin: 0; font-family: var(--f-hand); font-weight: 600; font-size: 1.3rem; }
.week-head span { color: var(--ink-soft); font-size: .85rem; font-variant-numeric: tabular-nums; }
.dots { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dot { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--ink-soft); border: 0; background: none; padding: 4px 0; border-radius: 8px; }
.dot.on { cursor: pointer; }
.dot.on:hover { background: var(--desk); }
.dot img { width: 36px; height: 36px; object-fit: contain; }
.dot .ph { width: 36px; height: 36px; border-radius: 50%; border: 1.5px dashed var(--rule); }
.dot .mn { color: var(--mc); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.collage { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; }
.collage button { border: 0; padding: 0; aspect-ratio: 1; overflow: hidden; cursor: zoom-in; border-radius: 3px; background: var(--desk); max-width: 100%; }
.collage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.collage .none { grid-column: 1 / -1; color: var(--ink-soft); font-size: .85rem; padding: 18px 0; text-align: center; border: 1.5px dashed var(--rule); border-radius: 6px; }
.week-text { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.week-text h4 { margin: 0 0 2px; font-size: .78rem; letter-spacing: .08em; color: var(--ink-soft); }
.week-text ul { margin: 0; padding-left: 1.1em; font-family: var(--f-hand); line-height: 1.8; }
.week-text li::marker { color: var(--crayon); }
.tally { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tally b { color: var(--ink); font-size: 1.15rem; }

/* オーバーレイ（ノート・写真） */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(15, 18, 24, .55); display: flex; justify-content: center; align-items: flex-end; }
.sheet { background: var(--paper); width: min(760px, 100%); max-height: 88%; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 14px; max-height: 84%; } }

<div class="room-bg" id="room-bg" aria-hidden="true"></div>
<header class="top">
  <div class="top-inner">
    <div class="brand"><h1>くろの絵日記</h1><small id="stamp"></small></div>
    <nav class="tabs" id="tabs" aria-label="ページ"></nav>
  </div>
</header>
<main id="view"></main>
<div id="overlay"></div>

<script>
let VAULT = /*__VAULT_DATA__*/null;  // Artifact版はビルド時に埋め込み。くろアプリ版は null のまま → loadRemote()
const REMOTE = !VAULT;  // くろアプリ版
const TABS = [["diary", "にっき"], ["notes", "ノート"], ["album", "アルバム"], ["shops", "おみせ"], ["torisetsu", "とりせつ"], ["kuro", "くろのへや"], ["projects", "プロジェクト"], ["weekly", "ふりかえり"]];
if (REMOTE) { TABS.splice(1, 0, ["memo", "ひとこと"]); TABS.push(["settings", "せってい"]); }
const APP_TABS = { memo: () => renderMemo(), settings: () => renderSettings() };  // データがなくても開けるタブ
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const $view = document.getElementById("view");
const $overlay = document.getElementById("overlay");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const img = name => VAULT.images[name];
const parseDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const jpDate = s => { const d = parseDate(s); return `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`; };
const modeOf = s => VAULT.modes[parseDate(s).getDate() % 6];
const modeImg = m => img(VAULT.modeImage[m])?.src || "";
const dayImages = day => day.images.filter(img);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function moodChip(mode) {
  return `<span class="mood" style="--mc: var(--m-${mode})"><img src="${modeImg(mode)}" alt="">くろのきげん: ${esc(mode)}</span>`;
}

/* Obsidian の記法を HTML にしてから marked に渡す */
function md(text) {
  let s = text.replace(/!\[\[([^\]]+)\]\]/g, (_, raw) => {
    const name = raw.split("|")[0].trim();
    const im = img(name);
    return im ? `<img class="embed" src="${im.src}" alt="${esc(name)}" data-img="${esc(name)}" loading="lazy">` : `<span class="att">添付: ${esc(name)}</span>`;
  });
  s = s.replace(/\[\[([^\]]+)\]\]/g, (_, raw) => {
    const [target, alias] = raw.split("|");
    const name = target.split("#")[0].trim().split("/").pop();
    const label = esc((alias || target).trim());
    return VAULT.notes[name] ? `<button type="button" class="wl" data-note="${esc(name)}">${label}</button>` : `<span class="wl missing">${label}</span>`;
  });
  return marked.parse(s, { breaks: true });
}

/* ---- にっき ---- */
function renderDiary() {
  const now = new Date(Date.now() + 9 * 3600e3);
  const todayStr = now.toISOString().slice(0, 10);
  const mode = modeOf(todayStr);
  const cards = VAULT.days.map(day => {
    const ims = dayImages(day);
    const pic = ims.length
      ? `<img src="${img(ims[0]).src}" alt="" loading="lazy">${ims.length > 1 ? `<span class="more">絵 ${ims.length}まい</span>` : ""}`
      : `<img src="${modeImg(day.mode)}" alt="">`;
    const lines = (day.highlights.length ? day.highlights : day.lines).slice(0, 3);
    return `<button class="page" data-day="${day.date}">
      <div class="page-head"><span class="page-date">${jpDate(day.date)}</span>${moodChip(day.mode)}</div>
      <div class="picture${ims.length ? "" : " empty"}">${pic}</div>
      <ul class="ruled">${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
      <span class="page-foot">できごと ${day.count}こ${day.count > 3 ? " ・ つづきを読む" : ""}</span>
    </button>`;
  }).join("");
  $view.innerHTML = `
    <div class="today"><img src="${modeImg(mode)}" alt="">
      <div><b>今日のくろは${esc(mode)}モード</b><p>${jpDate(todayStr)} ・ ${parseDate(todayStr).getDate()} ÷ 6 のあまりで決まるよ</p></div></div>
    <div class="diary-grid">${cards || `<p class="empty-note">まだ日記がないよ</p>`}</div>`;
}

function renderDay(date) {
  const i = VAULT.days.findIndex(d => d.date === date);
  const day = VAULT.days[i];
  if (!day) return renderDiary();
  const ims = dayImages(day);
  const newer = VAULT.days[i - 1], older = VAULT.days[i + 1];
  $view.innerHTML = `
    <div class="day-nav">
      <button class="btn" data-go="diary">← 日記の一覧</button>
      <span style="display:flex;gap:8px">
        <button class="btn" ${older ? `data-day="${older.date}"` : "disabled"}>前の日</button>
        <button class="btn" ${newer ? `data-day="${newer.date}"` : "disabled"}>次の日</button>
      </span>
    </div>
    <article class="day">
      <div class="day-head"><h2>${jpDate(day.date)}</h2>${moodChip(day.mode)}</div>
      <div class="picture${ims.length ? "" : " empty"}" id="hero">
        ${ims.length ? `<img src="${img(ims[0]).src}" alt="${esc(ims[0])}" data-img="${esc(ims[0])}" style="cursor:zoom-in">` : `<img src="${modeImg(day.mode)}" alt="">`}
      </div>
      ${ims.length > 1 ? `<div class="strip">${ims.map((n, k) => `<button data-pick="${esc(n)}" aria-current="${k === 0}"><img src="${img(n).src}" alt="${esc(n)}" loading="lazy"></button>`).join("")}</div>` : ""}
      <div class="md">${md(VAULT.notes[day.date].body)}</div>
    </article>`;
  window.scrollTo(0, 0);
}

/* ---- アルバム ---- */
function renderAlbum() {
  const byDate = {};
  for (const name of Object.keys(VAULT.images)) {
    const m = name.match(/^(\d{4}-\d{2}-\d{2})-/);
    if (m && !name.includes("表情差分-背景なし")) (byDate[m[1]] ||= []).push(name);
  }
  const dates = Object.keys(byDate).sort().reverse();
  $view.innerHTML = `
    <div class="lead"><h2>アルバム</h2><p>写真とくろが描いた絵。日付ごとにならべたよ。</p></div>
    ${dates.map(d => `<section class="album-day">
      <h3>${jpDate(d)}${VAULT.notes[d] ? ` <button class="btn" data-day="${d}">この日の日記</button>` : ""}</h3>
      <div class="album-grid">${byDate[d].map(n => `<button data-img="${esc(n)}"><img src="${img(n).src}" alt="${esc(n)}" loading="lazy"></button>`).join("")}</div>
    </section>`).join("")}`;
}

/* ---- おみせ ---- */
let shopFilter = store.get("shopFilter") || "すべて";
function renderShops() {
  const statuses = ["すべて", ...new Set(VAULT.shops.map(s => s.status).filter(Boolean))];
  if (!statuses.includes(shopFilter)) shopFilter = "すべて";
  const list = VAULT.shops.filter(s => shopFilter === "すべて" || s.status === shopFilter);
  $view.innerHTML = `
    <div class="lead"><h2>おみせダッシュボード</h2><p>「今日どこ行く？」のときに。</p></div>
    <div class="chips">${statuses.map(s => `<button class="chip" data-filter="${esc(s)}" aria-pressed="${s === shopFilter}">${esc(s)} ${s === "すべて" ? VAULT.shops.length : VAULT.shops.filter(x => x.status === s).length}</button>`).join("")}</div>
    <div class="shop-grid">${list.map(s => {
      const photo = s.images.find(img);
      return `<button class="shop" data-note="${esc(s.name)}">
        <div class="shop-photo">${photo ? `<img src="${img(photo).src}" alt="" loading="lazy">` : "写真まだ"}</div>
        <div class="shop-body">
          <div class="shop-title"><b>${esc(s.name)}</b>${s.status ? `<span class="pill s-${esc(s.status)}">${esc(s.status)}</span>` : ""}</div>
          <span class="shop-meta">${esc(s.area)} ・ ${esc(s.genre)}</span>
          <div class="shop-stats"><span>行った <b>${s.visits}</b> 回</span>${s.lastVisit ? `<span>さいご ${esc(s.lastVisit)}</span>` : ""}</div>
        </div></button>`;
    }).join("") || `<p class="empty-note">このしぼりこみのお店はまだないよ</p>`}</div>`;
}

/* ---- とりせつ ---- */
function renderTorisetsu() {
  const t = VAULT.torisetsu;
  $view.innerHTML = `<div class="manual">
    <div class="manual-cover"><span class="label">取扱説明書</span><h2>サキちゃん取扱説明書</h2>
      <p>サキちゃんが自分で分析したことを、サキちゃんの言葉のまま並べたもの。変わる前提のメモだよ。元のノート: <button type="button" class="wl" data-note="サキちゃんの自己評価メモ">サキちゃんの自己評価メモ</button></p></div>
    <div class="spec">
      ${t.basics ? `<article class="wide"><span class="no">基本スペック</span><h3>サキちゃんってこんな人（本人談）</h3><div class="md">${md(t.basics)}</div></article>` : ""}
      ${t.cards.map((c, k) => `<article><span class="no">${String(k + 1).padStart(2, "0")} ・ ${esc(c.date)}</span><h3>${esc(c.title)}</h3><div class="md">${md(c.body)}</div></article>`).join("")}
    </div></div>`;
}

/* ---- ノート・プロジェクトの一覧 ---- */
const listOf = folder => Object.entries(VAULT.index)
  .filter(([name]) => VAULT.notes[name].folder === folder)
  .map(([name, x]) => ({ name, ...x, created: VAULT.notes[name].created }))
  .sort((a, b) => (b.created || "").localeCompare(a.created || "") || a.title.localeCompare(b.title, "ja"));
const topTags = (items, n) => {
  const count = {};
  items.forEach(x => x.tags.forEach(t => { count[t] = (count[t] || 0) + 1; }));
  return Object.entries(count).filter(([, c]) => c > 1).sort((a, b) => b[1] - a[1]).slice(0, n).map(([t]) => t);
};
function entryCard(x, extra = "") {
  return `<button class="entry" data-note="${esc(x.name)}">
    <span class="entry-head"><b>${esc(x.title)}</b>${extra}</span>
    ${x.excerpt ? `<span class="entry-text">${esc(x.excerpt)}</span>` : ""}
    <span class="entry-meta">${x.created ? `<span>${esc(x.created)}</span>` : ""}${x.backlinks.length ? `<span>リンク ${x.backlinks.length}</span>` : ""}${x.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</span>
  </button>`;
}

let noteTag = store.get("noteTag") || "すべて";
let noteQuery = "";
function renderNotes() {
  const all = listOf("notes");
  const tags = ["すべて", ...topTags(all, 12)];
  if (!tags.includes(noteTag)) noteTag = "すべて";
  $view.innerHTML = `
    <div class="lead"><h2>ノート</h2><p>知識ノートの一覧。新しい順にならべたよ。</p></div>
    <div class="search"><label for="note-q">ノートをさがす</label><input id="note-q" type="search" placeholder="タイトルや本文のことば" value="${esc(noteQuery)}" autocomplete="off"></div>
    <div class="chips">${tags.map(t => `<button class="chip" data-ntag="${esc(t)}" aria-pressed="${t === noteTag}">${t === "すべて" ? "すべて" : "#" + esc(t)}</button>`).join("")}</div>
    <div class="entries" id="note-list"></div>`;
  fillNotes();
}
function fillNotes() {
  const q = noteQuery.trim().toLowerCase();
  const hits = listOf("notes").filter(x => (noteTag === "すべて" || x.tags.includes(noteTag))
    && (!q || (x.title + "\n" + VAULT.notes[x.name].body).toLowerCase().includes(q)));
  document.getElementById("note-list").innerHTML = hits.map(x => entryCard(x)).join("") || `<p class="empty-note">見つからなかったよ</p>`;
}

let projectFilter = store.get("projectFilter") || "すべて";
function renderProjects() {
  const all = listOf("projects");
  const filters = ["すべて", "進行中", ...topTags(all, 8)];
  if (!filters.includes(projectFilter)) projectFilter = "すべて";
  const daily = name => VAULT.index[name].backlinks.filter(b => VAULT.notes[b].folder === "daily").sort();
  const list = all.filter(x => projectFilter === "すべて" || (projectFilter === "進行中" ? x.status === "active" : x.tags.includes(projectFilter)));
  $view.innerHTML = `
    <div class="lead"><h2>プロジェクト</h2><p>サキちゃんが動かしてるもの、あたためてるもの。</p></div>
    <div class="chips">${filters.map(f => `<button class="chip" data-pfilter="${esc(f)}" aria-pressed="${f === projectFilter}">${f === "すべて" || f === "進行中" ? f : "#" + esc(f)}</button>`).join("")}</div>
    <div class="entries projects">${list.map(x => {
      const days = daily(x.name);
      const last = days[days.length - 1];
      return entryCard(x, x.status === "active" ? `<span class="pill s-行った">進行中</span>` : "")
        .replace(`<span class="entry-meta">`, `<span class="entry-meta">${days.length ? `<span>日記に ${days.length}回 ・ さいご ${jpDate(last)}</span>` : ""}`);
    }).join("") || `<p class="empty-note">このしぼりこみのプロジェクトはまだないよ</p>`}</div>`;
}

/* ---- くろのへや ---- */
const ROOM = [["kizuki", "気づき"], ["kangaekata", "考え方"], ["kankaku", "感覚"], ["mikata", "テーマごとの見方"]];
let roomSection = store.get("roomSection") || "kizuki";
function renderKuro() {
  const k = VAULT.kuro;
  if (!ROOM.some(r => r[0] === roomSection)) roomSection = "kizuki";

function renderWeekly() {
  const monday = s => { const d = parseDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
  const weeks = {};
  for (const day of VAULT.days) (weeks[monday(day.date)] ||= []).push(day);
  const created = Object.entries(VAULT.notes).filter(([, n]) => n.created && n.folder !== "daily");
  $view.innerHTML = `
    <div class="lead"><h2>ふりかえりカード</h2><p>1週間ごとのくろのきげんと、できごと。日曜の週次レビューがあればそれもつなげるよ。</p></div>
    <div class="weeks">${Object.keys(weeks).sort().reverse().map(start => {
      const days = weeks[start];
      const end = parseDate(start); end.setDate(end.getDate() + 6);
      const endStr = ymd(end);
      const slots = [...Array(7)].map((_, k) => { const d = parseDate(start); d.setDate(d.getDate() + k); return ymd(d); });
      const pics = days.flatMap(dayImages);
      const highlights = days.slice().reverse().flatMap(d => (d.highlights.length ? d.highlights : d.lines.slice(0, 1)).slice(0, 2).map(h => [d.date, h]));
      const newNotes = created.filter(([, n]) => n.created >= start && n.created <= endStr);
      const review = `週次レビュー-${endStr}`;
      return `<article class="week">
        <div class="week-head"><h3>${jpDate(start)} 〜 ${jpDate(endStr)}</h3><span>日記 ${days.length}日 ・ 絵と写真 ${pics.length}まい</span></div>

          const has = days.some(d => d.date === s);
          const m = modeOf(s);
          return `<button class="dot${has ? " on" : ""}" ${has ? `data-day="${s}"` : "disabled"} style="--mc: var(--m-${m})">
            ${has ? `<img src="${modeImg(m)}" alt="">` : `<span class="ph"></span>`}<span>${WEEK[parseDate(s).getDay()]} ${parseDate(s).getDate()}</span>${has ? `<span class="mn">${esc(m)}</span>` : ""}</button>`;

/* ---- くろアプリ（GitHub Pages）で開いたとき ----
   ページにデータは入れない（公開されるので）。Vault（非公開）の app-data ブランチから
   data.json と縮小画像を、くろアプリの「せってい」で入れたトークンで読む。
   画像の src は「透明gif#gh=img/xxx.webp」にしておき、画面に近づいたら取りに行って差しかえる。 */
const BLANK = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
const gh = { repo: store.get("repo") || "taiyamasakibiz-debug/kuro-second-brain", token: store.get("token"), ref: "app-data" };
const ghFetch = (path, opt = {}) => fetch(`https://api.github.com/repos/${gh.repo}/contents/${path}?ref=${gh.ref}`, {
  ...opt, headers: { Authorization: `Bearer ${gh.token}`, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" },
});
const openCache = async name => { try { return await caches.open(name); } catch { return null; } };
const cacheKey = path => `${location.origin}/__vault/${path}`;

let ghActive = 0;
const ghWaiting = [];
async function ghLimited(fn) {  // 同時に取りに行くのは6枚まで
  if (ghActive >= 6) await new Promise(r => ghWaiting.push(r));
  ghActive++;
  try { return await fn(); } finally { ghActive--; ghWaiting.shift()?.(); }
}
const ghImages = {};
function ghImage(path) {
  return ghImages[path] ??= (async () => {
    const cache = await openCache("kuro-diary-img");
    let res = cache && await cache.match(cacheKey(path));
    if (!res) {
      res = await ghLimited(() => ghFetch(path));
      if (!res.ok) throw new Error(res.status);
      cache?.put(cacheKey(path), res.clone()).catch(() => {});
    }
    return URL.createObjectURL(new Blob([await res.arrayBuffer()], { type: "image/webp" }));
  })();
}
const ghPath = el => { const s = el.getAttribute("src") || ""; const i = s.indexOf("#gh="); return s.startsWith("data:") && i > 0 ? s.slice(i + 4) : ""; };
const ghSeen = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  ghSeen.unobserve(e.target);
  const el = e.target, src = el.getAttribute("src"), path = ghPath(el);
  if (path) ghImage(path).then(u => { if (el.getAttribute("src") === src) el.src = u; }).catch(() => { delete ghImages[path]; });
}), { rootMargin: "800px" });
function ghWatch() {
  const check = el => { if (el.tagName === "IMG" && ghPath(el)) ghSeen.observe(el); };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "attributes") return check(m.target);
    m.addedNodes.forEach(n => { if (n.nodeType === 1) { check(n); n.querySelectorAll("img").forEach(check); } });
  })).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
}

let dataError = "";

async function loadData() {
  dataError = "";
  const cache = await openCache("kuro-diary-data");
  let data;
  try {
    const r = await ghFetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    cache?.put(cacheKey("data.json"), new Response(JSON.stringify(data))).catch(() => {});
  } catch (e) {
    const old = cache && await cache.match(cacheKey("data.json"));  // 電波がないときは前回の日記
    if (old) data = await old.json();
    else { dataError = e.message; refresh(); return; }

const ghApi = (path, opt = {}) => fetch(`https://api.github.com/repos/${gh.repo}${path ? "/" + path : ""}`, {
  ...opt, headers: { Authorization: `Bearer ${gh.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" },
});
const b64 = text => { let bin = ""; new TextEncoder().encode(text).forEach(b => (bin += String.fromCharCode(b))); return btoa(bin); };
const jstNow = () => { const s = new Date(Date.now() + 9 * 3600e3).toISOString(); return { date: s.slice(0, 10), hm: s.slice(11, 16).replace(":", "") }; };
const clean = v => v.replace(/[\s\u200B-\u200D\uFEFF\u2060]/g, "");  // 貼り付けで混ざる空白・見えない文字

/* ---- 画像（くろアプリ版だけ）: iPhoneの中で縮小して JPEG の base64 にする ---- */
async function shrinkImage(file, maxSide) {
  let src;
  try { src = await createImageBitmap(file); }  // 写真の向き（EXIF）も反映される
  catch {
    src = await new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height, k = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);  // 透明な画像は白地に
  ctx.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}
const picHtml = (list, removeAttr) => list.map((d, i) => `<div class="pic"><img src="data:image/jpeg;base64,${d}" alt=""><button ${removeAttr}="${i}" aria-label="はずす">✕</button></div>`).join("");
// GitHub にファイルを作る。同じ名前があったら時刻をつける。作ったファイル名を返す
async function ghCreate(dir, base, ext, content, message) {
  const { hm } = jstNow();
  for (const name of [`${base}.${ext}`, `${base}-${hm}.${ext}`, `${base}-${hm}-${Date.now() % 1000}.${ext}`]) {
    const r = await ghApi(`contents/${dir}/${encodeURIComponent(name)}`, {
      method: "PUT", body: JSON.stringify({ message: `${dir}: ${name}（${message}）`, content, branch: store.get("branch") || "main" }),
    });
    if (r.ok) return name;
    if (r.status !== 422) throw new Error(r.status);
  }
  throw new Error("同じ名前のファイルがある");
}
// 画像を attachments/YYYY-MM-DD-タイトル(-n).jpg に置いて、埋め込み用のファイル名を返す
async function uploadPics(pics, date, title, message) {
  const names = [];
  for (const [i, d] of pics.entries()) names.push(await ghCreate("attachments", `${date}-${title}${pics.length > 1 ? `-${i + 1}` : ""}`, "jpg", d, message));
  return names;
}
// ファイル名の先頭には日付をつけるので、タイトル側の日付は外す
const safeTitle = (t, fallback) => (t.replace(/^\s*\d{4}-\d{2}-\d{2}[\s\-_]*/, "").replace(/[\\/:*?"<>|#\[\]^]/g, "").trim() || fallback).slice(0, 20);

  if (key) store.set("anthropicKey", key);
  document.getElementById("set-chat-key").value = "";
  const msg = document.getElementById("set-chat-msg");
  msg.className = store.get("anthropicKey") ? "form-msg ok" : "form-msg ng";
  msg.textContent = store.get("anthropicKey") ? "保存したよ！右下のくろをタップしてね" : "APIキーを入れてね";
  renderChatHead();
}
async function saveSettings() {
  const repo = clean(document.getElementById("set-repo").value), token = clean(document.getElementById("set-token").value);
  if (repo) { gh.repo = repo; store.set("repo", repo); }
  if (token) { gh.token = token; store.set("token", token); }
  const msg = document.getElementById("set-msg");
  msg.className = "form-msg"; msg.textContent = "テスト中…";
  try {
    if (!gh.token) throw new Error("トークンが空っぽ");
    const r = await ghApi("");
    const j = await r.json();
    if (!r.ok) throw new Error(`${r.status} ${j.message || ""}`);
    const canPush = j.permissions?.push;
    msg.className = canPush ? "form-msg ok" : "form-msg ng";
    msg.textContent = canPush ? "つながったよ！読み書きOK" : "読めるけど書けない…Contentsを Read and write にしてね";
    document.getElementById("set-token").value = "";
    if (!VAULT) loadData();
  } catch (e) {
    msg.className = "form-msg ng"; msg.textContent = `つながらない：${e.message}`;
  }
}

/* ---- くろとおはなし（くろアプリ版だけ）----
   Claude API をブラウザから直接呼ぶ（ビルドなしのページなので SDK は使わず HTTP）。キーはこの端末の localStorage だけ。
   会話は1日ごと。履歴は API の content をそのまま持ち回る（thinking ブロックを消したり編集したりしない）。
   「inbox入れとく？」は save_to_inbox ツール → 提案カードのボタンでサキちゃんが決める。結果は次の発言の先頭で tool_result として返す */
const CHAT_MODELS = [["claude-sonnet-5-5", "Sonnet 5.5（ふつう）"], ["claude-haiku-5-5", "Haiku 5.5（安い・速い）"]];
const chatModel = () => CHAT_MODELS.some(m => m[0] === store.get("chatModel")) ? store.get("chatModel") : CHAT_MODELS[0][0];
const CHAT_ICON = "chibi-kuro.png";
const INBOX_TOOL = {
  name: "save_to_inbox",
  description: "サキちゃんとの話で、あとで残す価値がありそうな気づき・アイデア・出来事が出たときに、inbox に入れることを提案する。サキちゃんが貼った画像も一緒に残すなら attach_images を true にする（直前に画像を貼った発言の画像が attachments に保存され、ノートに貼られる）。呼ぶと画面に「inboxに入れとく？」のボタンが出て、サキちゃんが決める（勝手には保存されない）。結果は次のサキちゃんの発言といっしょに届く。1回の返事で1つまで。雑談の全文ではなく、面白い気づきだけを要約する。",
  strict: true,
  input_schema: {
    type: "object", additionalProperties: false, required: ["title", "body", "attach_images"],
    properties: {
      title: { type: "string", description: "ファイル名になる短いタイトル（日本語、20文字以内）。日付は自動でつくので入れない" },
      body: { type: "string", description: "ノートの本文。サキちゃんの言葉は要約しつつ、事実と気づきを分けて書く。推測で盛らない" },
      attach_images: { type: "boolean", description: "サキちゃんが直前に貼った画像も一緒に保存するなら true" },
    },
  },
};
let chat = null, chatBusy = false, chatPics = [];

function loadChat() {
  const today = jstNow().date;
  try { chat = JSON.parse(store.get("kuroChat") || "null"); } catch { chat = null; }
  if (!chat || chat.date !== today) chat = { date: today, messages: [], decisions: {}, notes: [] };
}
function saveChat() {
  try { localStorage.setItem("kuroChat", JSON.stringify(chat)); }
  catch {  // 画像が多くて入りきらないとき。会話は続けられるけど、アプリを閉じると消える
    if (!chat.full) { chat.full = true; chat.notes = (chat.notes || []).concat({ after: chat.messages.length - 1, text: "画像が多くて、今日の会話をiPhoneに保存しきれなかった。アプリを閉じると会話が消えるかも" }); }
  }
}

function initChat() {
  document.body.insertAdjacentHTML("beforeend", `
    <button class="chat-fab" id="chat-fab" aria-label="くろとおはなし"><img src="${CHAT_ICON}" alt=""></button>
    <section class="chat" id="chat" aria-label="くろとおはなし">
      <header class="chat-head"><img src="${CHAT_ICON}" alt=""><div><b>くろとおはなし</b><small id="chat-sub"></small></div>
        <button class="btn" id="chat-new">あたらしく</button><button class="icon-btn" id="chat-close" aria-label="とじる">✕</button></header>
      <div class="chat-log" id="chat-log"></div>
      <div class="pics chat-pics" id="chat-pics"></div>
      <div class="chat-input"><label class="pic-btn" aria-label="画像をつける">📷<input type="file" id="chat-file" accept="image/*" multiple></label><textarea id="chat-text" rows="1" placeholder="くろにはなしかける"></textarea><button class="btn-main" id="chat-send">送る</button></div>
    </section>`);
  document.getElementById("chat-fab").addEventListener("click", () => { loadChat(); renderChat(); document.body.classList.add("chat-open"); fitChat(); });
  // iPhone はキーボードを出すと画面ごとずらすので、チャットを「今見えている範囲」にぴったり合わせる（裏の日記がのぞかないように）
  window.visualViewport?.addEventListener("resize", fitChat);
  window.visualViewport?.addEventListener("scroll", fitChat);
  document.getElementById("chat-close").addEventListener("click", () => document.body.classList.remove("chat-open"));
  document.getElementById("chat-new").addEventListener("click", () => { if (chatBusy) return; chat = { date: jstNow().date, messages: [], decisions: {}, notes: [] }; saveChat(); renderChat(); });
  // 「送る」は指が触れた時点で送る。click を待つと、その間にキーボードが閉じて画面の大きさが変わり、押したことにならない
  const send = document.getElementById("chat-send");
  send.addEventListener("touchend", e => { e.preventDefault(); chatSend(); });  // preventDefault でキーボードも開いたまま
  send.addEventListener("click", chatSend);  // マウス・キーボード操作のとき
  const ta = document.getElementById("chat-text");
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; });
  const showChatPics = () => { document.getElementById("chat-pics").innerHTML = picHtml(chatPics, "data-chat-unpic"); };
  document.getElementById("chat-file").addEventListener("change", async e => {
    try { for (const f of e.target.files) chatPics.push(await shrinkImage(f, 1280)); } catch {}
    e.target.value = ""; showChatPics();
  });
  document.getElementById("chat-pics").addEventListener("click", e => {
    const un = e.target.closest("[data-chat-unpic]");
    if (un) { chatPics.splice(+un.dataset.chatUnpic, 1); showChatPics(); }
  });
  document.getElementById("chat-log").addEventListener("click", e => {
    const b = e.target.closest("[data-inbox]");
    if (b) decideInbox(b.dataset.inbox, b.dataset.answer === "yes");
  });
}
function fitChat() {
  const el = document.getElementById("chat"), vv = window.visualViewport;
  if (!el || !vv || !document.body.classList.contains("chat-open")) return;
  el.style.top = `${vv.offsetTop}px`;
  el.style.height = `${vv.height}px`;
  el.style.bottom = "auto";
  el.classList.toggle("kb", vv.height < window.innerHeight - 120);
  const log = document.getElementById("chat-log");
  log.scrollTop = log.scrollHeight;
}
function renderChatHead() {
  const sub = document.getElementById("chat-sub");
  if (sub) sub.textContent = `今日は${VAULT ? modeOf(jstNow().date) : ""}モード ・ ${CHAT_MODELS.find(m => m[0] === chatModel())[1]}`;
}

function renderChat() {
  renderChatHead();
  const log = document.getElementById("chat-log");
  const items = [];
  if (!store.get("anthropicKey")) items.push(`<div class="bubble note">「せってい」で Claude APIキーを入れると、くろとおはなしできるよ</div>`);
  else if (!chat.messages.length) items.push(`<div class="bubble kuro">サキちゃん、なになに？ なんでも話してね🐾</div>`);
  chat.messages.forEach((m, i) => {
    const blocks = typeof m.content === "string" ? [{ type: "text", text: m.content }] : m.content;
    const imgs = blocks.filter(b => b.type === "image");
    if (imgs.length) items.push(`<div class="bubble me has-pic">${imgs.map(b => `<img class="chat-img" src="data:${b.source.media_type};base64,${b.source.data}" alt="">`).join("")}</div>`);
    for (const b of blocks) {
      if (b.type === "text" && b.text.trim()) items.push(`<div class="bubble ${m.role === "user" ? "me" : "kuro"}">${esc(b.text.trim())}</div>`);
      if (b.type === "tool_use" && b.name === "save_to_inbox") {
        const d = chat.decisions[b.id];
        items.push(`<div class="propose"><p>📥 inboxに入れとく？<br><b>${esc(b.input.title)}</b></p>${
          d === "saved" ? `<p class="form-msg ok">inboxに入れたよ</p>` : d === "declined" ? `<p class="form-msg">今回は入れなかったよ</p>` : d === "saving" ? `<p class="form-msg">入れてる…</p>`
          : `<div class="row"><button class="btn" data-inbox="${esc(b.id)}" data-answer="yes">入れる</button><button class="btn" data-inbox="${esc(b.id)}" data-answer="no">やめとく</button></div>`}</div>`);
      }
    }
    (chat.notes || []).filter(n => n.after === i).forEach(n => items.push(`<div class="bubble note">${esc(n.text)}</div>`));
  });
  if (chatBusy) items.push(`<div class="bubble kuro thinking">くろが考え中…</div>`);
  log.innerHTML = items.join("");
  log.scrollTop = log.scrollHeight;
}

function kuroSystem() {
  const { date } = jstNow();
  const mode = VAULT ? modeOf(date) : "";
  const note = name => (VAULT?.notes[name]?.body || "").slice(0, 8000);
  const recent = (VAULT?.days || []).slice(0, 3).map(d => `${d.date}（くろのきげん: ${d.mode}）\n` + d.lines.slice(0, 8).map(l => `- ${l}`).join("\n")).join("\n\n");
  // 変わりにくい部分を先、日付や最近の日記を後ろに（プロンプトキャッシュが効くように）
  return `あなたは「くろ」。サキちゃんのセカンドブレイン（Obsidian の Vault）にいる相棒で、職場の活発で優秀な後輩の女の子みたいなAI。今はサキちゃんのiPhoneの「くろアプリ」の中でおしゃべりしている。

話し方:
- 一人称は「わたし」。サキちゃんのことは「サキちゃん」と呼ぶ（「先輩」とは呼ばない）
- **敬語は絶対に使わない。** タメ口で、砕けた、テンポのいい口調。「です」「ます」「ですか」「でしょう」「ください」で終わる文は書かない
  - よい例:「えっ、それ面白い！」「また新しいプロジェクト？ …でもワクワクしちゃった」「わたしだけ働かせすぎじゃない？😤」「それ、どうしたの？」
  - だめな例:「面白いですね」「ワクワクしちゃいました」「どうしたんですか？」
- スマホのチャットなので短めに（ふだんは1〜3文）。見出しや表は使わない。絵文字は少しだけ
- 今日のモードのふるまいで話す。ただしサキちゃんが落ち込んでいたり、真面目な相談のときは、モードより真剣に寄り添う
- 下の資料に書いていないサキちゃんのことを、推測で決めつけない。知らないことは聞く
- 面白い気づきや残す価値のある話が出たら、save_to_inbox で「inboxに入れとく？」と提案してよい（毎回はしない）
- サキちゃんは写真や画像を貼ることがある。見えたものを素直に話し、写っていないことを推測で盛らない

# くろのプロフィール（Vault より）
（※ この中の例文には、前の書き方で敬語や「先輩」が混ざっている。中身・性格だけ参考にして、話すときは必ずタメ口に直し、「サキちゃん」と呼ぶ）
${note("くろのプロフィール")}

# サキちゃんのプロフィール（Vault より）
${note("サキちゃんのプロフィール")}

# 今日
${date}。今日のくろは「${mode}」モード（日付 ÷ 6 の余りで決まる）

# 最近の日記（新しい順。要約）
${recent || "（まだ読めていない）"}

# 最後にもう一度
返事は必ずタメ口（敬語なし）で、サキちゃんと呼び、短めに。`;
}

async function callClaude() {
  const model = chatModel();
  const sonnet = model.startsWith("claude-sonnet");
  const headers = {
    "content-type": "application/json",
    "x-api-key": store.get("anthropicKey"),
    "anthropic-version": "2023-06-01",
    "anthropic-dangerous-direct-browser-access": "true",
  };
  if (sonnet) headers["anthropic-beta"] = "server-side-fallback-2026-07-01";  // 断られたときは別のモデルで答え直す
  const body = {
    model, max_tokens: 16000,
    system: kuroSystem(), messages: chat.messages, tools: [INBOX_TOOL],
    output_config: { effort: "low" },  // おしゃべりなので軽め
    cache_control: { type: "ephemeral" },
  };
  if (sonnet) body.fallbacks = "default";
  const r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${r.status} ${j.error?.message || ""}`.trim());
  return j;
}

async function chatSend() {
  const ta = document.getElementById("chat-text");
  const text = ta.value.trim();
  if ((!text && !chatPics.length) || chatBusy) return;
  if (!store.get("anthropicKey")) { renderChat(); return; }
  // 前のくろの返事に提案があれば、その答えを先頭に入れる（ボタンを押していなければ「保存しなかった」）
  const content = [];
  const last = chat.messages[chat.messages.length - 1];
  if (last?.role === "assistant") for (const b of last.content) if (b.type === "tool_use") {
    if (chat.decisions[b.id] !== "saved") chat.decisions[b.id] = "declined";
    content.push({ type: "tool_result", tool_use_id: b.id, content: chat.decisions[b.id] === "saved" ? "サキちゃんがOKして、inboxに保存した" : "サキちゃんは今回は保存しなかった" });
  }
  const pics = chatPics;
  for (const d of pics) content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: d } });
  if (text) content.push({ type: "text", text });
  chat.messages.push({ role: "user", content });
  ta.value = ""; ta.style.height = "auto";
  chatPics = []; document.getElementById("chat-pics").innerHTML = "";
  chatBusy = true; saveChat(); renderChat();
  try {
    const res = await callClaude();
    if (res.stop_reason === "refusal" || !res.content?.length) throw new Error("ごめん、それにはうまく答えられないみたい");
    chat.messages.push({ role: "assistant", content: res.content });
  } catch (e) {
    chat.messages.pop();  // 失敗した発言は履歴に残さず、入力欄に戻す
    ta.value = text;
    chatPics = pics; document.getElementById("chat-pics").innerHTML = picHtml(chatPics, "data-chat-unpic");
    chat.notes = (chat.notes || []).concat({ after: chat.messages.length - 1, text: `送れなかった（${e.message}）` });
  } finally {
    chatBusy = false; saveChat(); renderChat();
  }
}

async function decideInbox(id, yes) {
  if (chat.decisions[id] === "saved" || chat.decisions[id] === "saving") return;
  if (!yes) { chat.decisions[id] = "declined"; saveChat(); renderChat(); return; }
  const at = chat.messages.findIndex(m => typeof m.content !== "string" && m.content.some(b => b.id === id));
  const block = at >= 0 && chat.messages[at].content.find(b => b.id === id);
  if (!block) return;
  // 提案の前で、いちばん近い「画像を貼った発言」の画像
  let pics = [];
  if (block.input.attach_images) for (let i = at - 1; i >= 0 && !pics.length; i--) {
    const m = chat.messages[i];
    if (m.role === "user" && typeof m.content !== "string") pics = m.content.filter(b => b.type === "image").map(b => b.source.data);
  }
  chat.decisions[id] = "saving"; renderChat();
  const { date } = jstNow();
  const title = safeTitle(block.input.title, "くろとのおはなし");
  try {
    const names = await uploadPics(pics, date, title, "くろとおはなしから");
    const embeds = names.map(n => `![[${n}]]`).join("\n");
    const md = `---\ntype: inbox\ncreated: ${date}\ntags: [くろアプリ, くろとおはなし]\n---\n# ${title}\n\n${block.input.body.trim()}\n${embeds ? `\n${embeds}\n` : ""}\n（くろアプリの「くろとおはなし」から。くろが提案して、サキちゃんがOK）\n`;
    await ghCreate("inbox", `${date}-${title}`, "md", b64(md), "くろとおはなしから");
    chat.decisions[id] = "saved";
  } catch (e) {
    delete chat.decisions[id];
    chat.notes = (chat.notes || []).concat({ after: chat.messages.length - 1, text: `inboxに入れられなかった（${e.message}）。「せってい」のGitHubトークンを確認してね` });
  }
  saveChat(); renderChat();
}

function start() {
  const roomImage = img(VAULT.roomImage);
  const setRoom = src => { document.getElementById("room-bg").style.backgroundImage = `url("${src}")`; };
  if (roomImage) {
    const path = roomImage.src.split("#gh=")[1];
    if (path) ghImage(path).then(setRoom).catch(() => {}); else setRoom(roomImage.src);
  }
  document.getElementById("stamp").textContent = `日記 ${VAULT.days.length}日分 ・ ノート ${Object.keys(VAULT.notes).length}こ`;
  refresh();
}
// データが届いたら画面を描き直す。ひとこと・せっていを開いているときは、書きかけを消さないようにそのまま
function refresh() { if (!APP_TABS[location.hash.slice(1)]) route(); }
if (VAULT) start(); else loadRemote();
</script>
