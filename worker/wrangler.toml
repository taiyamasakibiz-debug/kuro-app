# くろクラウド（Cloudflare Worker）。くわしくは README の「worker/（くろクラウド）」
# デプロイ: cd worker && npx wrangler deploy
# キーは secret で入れる（このファイルには書かない）:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put KURO_CODE
#   npx wrangler secret put SHANONE_API_KEY
#   npx wrangler secret put SHANONE_ORG_ID
#   npx wrangler secret put OPENAI_API_KEY   # 絵を描く（Images だけのキー）。なくても動く
name = "kuro-cloud"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false  # 版ごとの別URL（プレビュー）は作らない。入口は workers.dev の1つだけ

[vars]
VAULT_REPO = "taiyamasakibiz-debug/kuro-second-brain"
ALLOW_ORIGINS = "https://taiyamasakibiz-debug.github.io"
# Shanone の入口（既定は .mcp.json と同じ開発版）。キーと入口はセットで合わせる
SHANONE_URL = "https://dev-akaso-mcp.shanone.ai/mcp"

[observability]
enabled = true
